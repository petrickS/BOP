services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bop
      POSTGRES_PASSWORD: bop
      POSTGRES_DB: bop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bop -d bop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
